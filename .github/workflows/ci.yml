name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-backend:
    name: Backend deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: install-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Run unit scripts
        working-directory: backend
        run: |
          set -e
          echo "## Unit tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:unit
          echo "- subscriptionClientDetect ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- subscriptionMask ✅" >> "$GITHUB_STEP_SUMMARY"

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: install-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Vitest API + OpenAPI contract
        working-directory: backend
        run: |
          set -e
          echo "## API tests" >> "$GITHUB_STEP_SUMMARY"
          npm run test:api
          echo "- OpenAPI contract matrix ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- users lifecycle / slow-network / auth ✅" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend

  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - run: echo "All checks green"
